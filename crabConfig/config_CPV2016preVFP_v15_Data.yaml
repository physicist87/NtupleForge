# ================================================================================
# CPV (top CP-violation) analysis — 2016preVFPUL, NanoAODv15 — DATA ONLY
#
# Modified by Seungkyu Ha (seungkyu.ha@cern.ch)
#
# This configuration is the NanoAODv15 update of the Run-2 UL CPV production
# configuration. Dataset paths are taken from the user-provided Run2 NanoAODv15
# sample list and filtered for the corresponding data-taking era.
#
# DATA / MC wiring
# ----------------
# Data -> modules/noop.py
#         + branches/branch_CPV_Run2_Data.txt
# MC   -> modules/topCPVCategorizer.py
#         + branches/branch_CPV_Run2_MC.txt
# The generator-level top CPV categorizer is MC-only and must not be run on Data.
#
# DATASET SELECTION
# -----------------
# - NanoAODv15 only.
# - QCD samples are excluded from MC.
# - TTJets samples are excluded from MC; TTTo2L2Nu / TTToSemiLeptonic /
#   TTToHadronic samples are retained.
# - 2016 preVFP MC uses the APV/preVFP campaign.
# - 2016 preVFP Data uses the HIPM datasets.
# - SinglePhoton is excluded from 2016/2017 Data.
#
# STATUS
# ------
# FINAL : analysis_module / branch_file tier wiring.
# FINAL : dataset selection according to the rules above.
# NOTE  : dataset paths originate from the provided sample list; this header does
#         not claim an independent full DAS validation of every NanoAODv15 path.
# FINAL : Data uses LumiBased / 10 lumis per job; MC uses FileBased / 1 file per job.
# Analyst-controlled production tags: jobID / output_base.
# ================================================================================

common:
  year: "2016"
  sample_type: "Data"
  jobID: "CPV2016preVFP_v15_Data"
  site: "T3_KR_KNU"
  output_base: "CPV_ntuple/NanoAODv15/2016PreVFP/Data"
  analysis_module: ["modules/noop.py", "MODULES"]
  branch_file: "branches/branch_CPV_Run2_Data.txt"
  splitting: "LumiBased"
  units_per_job: 10

